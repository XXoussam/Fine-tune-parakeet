name: "Parakeet_TDT_Finetuning"

# Use exactly one of these to pick the starting checkpoint.
# - init_from_pretrained_model: downloads/reuses the official NVIDIA checkpoint (NGC/HF)
# - init_from_nemo_model: path to a local .nemo file (e.g. a previous fine-tune)
init_from_pretrained_model: nvidia/parakeet-tdt-0.6b-v3
init_from_nemo_model: null

model:
  sample_rate: 16000

  train_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16 # reduce if you hit CUDA OOM on the VM's GPU
    shuffle: true
    num_workers: 8
    pin_memory: true
    max_duration: 20
    min_duration: 0.1
    is_tarred: false
    tarred_audio_filepaths: null
    shuffle_n: 2048
    bucketing_strategy: "fully_randomized"
    bucketing_batch_size: null

  validation_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  # parakeet-tdt-0.6b-v3 is a multilingual BPE model. Keep update_tokenizer=false
  # to fine-tune on the existing 25-language vocab (the normal case for adapting
  # to new audio/domain in a language it already supports). Only set it true -
  # with a tokenizer dir - if you are adding a language/vocab it doesn't have.
  char_labels:
    update_labels: false
    labels: null

  tokenizer:
    update_tokenizer: false
    dir: null
    type: bpe

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  optim:
    name: adamw
    lr: 1e-5 # small LR: fine-tuning a converged 0.6B model, not training from scratch
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    sched:
      name: CosineAnnealing
      warmup_steps: 500
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: 1 # bump to -1 (all GPUs) or a count once you know the VM's GPU setup
  num_nodes: 1
  max_epochs: 50
  max_steps: -1
  val_check_interval: 1.0
  accelerator: auto
  strategy: auto # DDPStrategy is only relevant once devices > 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: bf16-mixed # falls back to fp32 automatically on GPUs without bf16 support
  log_every_n_steps: 10
  enable_progress_bar: true
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  enable_checkpointing: false # exp_manager handles checkpointing below
  logger: false
  benchmark: false

exp_manager:
  exp_dir: ./nemo_experiments
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 5
    always_save_nemo: true
  resume_if_exists: true
  resume_ignore_no_checkpoint: true
  create_wandb_logger: false
  wandb_logger_kwargs:
    name: null
    project: null
